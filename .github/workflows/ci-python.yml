name: CI · Python

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detectar projeto Python
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.check.outputs.found }}
      has_tests: ${{ steps.check.outputs.has_tests }}
      has_pyproject: ${{ steps.check.outputs.has_pyproject }}
    steps:
      - uses: actions/checkout@v5

      - id: check
        shell: bash
        run: |
          found=false
          if compgen -G "pyproject.toml" > /dev/null \
            || compgen -G "setup.py" > /dev/null \
            || compgen -G "setup.cfg" > /dev/null \
            || compgen -G "requirements*.txt" > /dev/null; then
            found=true
          fi
          has_tests=false
          if [ -d tests ] || [ -d test ] || compgen -G "**/test_*.py" > /dev/null; then
            has_tests=true
          fi
          has_pyproject=false
          if [ -f pyproject.toml ]; then has_pyproject=true; fi
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"
          echo "has_pyproject=$has_pyproject" >> "$GITHUB_OUTPUT"
          echo "Python detectado: $found | testes: $has_tests"

  lint:
    name: Lint & format (ruff)
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar ruff
        run: pip install --upgrade ruff

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format (verificação)
        run: ruff format --check --diff .

  typecheck:
    name: Type check (mypy)
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip mypy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e . || true; fi

      - name: mypy
        run: mypy . --ignore-missing-imports --pretty

  test:
    name: Testes (Python ${{ matrix.python-version }})
    needs: detect
    if: needs.detect.outputs.found == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        include:
          - os: windows-latest
            python-version: '3.12'
          - os: macos-latest
            python-version: '3.12'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependências
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e ".[dev]" || pip install -e . || true; fi

      - name: pytest
        if: needs.detect.outputs.has_tests == 'true'
        shell: bash
        run: pytest --cov --cov-report=xml --cov-report=term-missing -q

      - name: Smoke import (sem testes)
        if: needs.detect.outputs.has_tests != 'true'
        shell: bash
        run: |
          echo "::warning::Nenhuma suíte de testes encontrada — rodando apenas verificação de sintaxe."
          python -m compileall -q .

      - name: Publicar cobertura
        if: needs.detect.outputs.has_tests == 'true' && matrix.python-version == '3.12' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-python
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build do pacote
    needs: [detect, lint]
    if: needs.detect.outputs.found == 'true' && needs.detect.outputs.has_pyproject == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Build sdist + wheel
        run: |
          pip install --upgrade build twine
          python -m build
          twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/
